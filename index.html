const themesIn=k=>st.themes.filter(t=>t.section===k).sort(byDate);
const theme=id=>st.themes.find(t=>t.id===id);
const photosOf=id=>st.photos.filter(p=>p.themeId===id).sort(byDate);
const rootsIn=k=>st.themes.filter(t=>!t.parentId&&t.section===k).sort(byDate);
const kids=id=>st.themes.filter(t=>t.parentId===id).sort(byDate);
function subtree(id){const out=[id];for(let i=0;i<out.length&&i<5000;i++)st.themes.forEach(t=>{if(t.parentId===out[i]&&!out.includes(t.id))out.push(t.id)});return out}
const photosDeep=id=>{const s=new Set(subtree(id));return st.photos.filter(p=>s.has(p.themeId)).sort(byDate)};
function chain(id){const c=[];let t=theme(id),g=0;while(t&&g++<50){c.unshift(t);t=t.parentId?theme(t.parentId):null}return c}
const secOf=p=>{const t=theme(p.themeId);return t?t.section:null};
const countSec=k=>st.photos.filter(p=>secOf(p)===k).length;
const full=p=>(URLS[p.imgId]&&URLS[p.imgId].full)||'';
const thumb=p=>(URLS[p.imgId]&&URLS[p.imgId].thumb)||full(p);
const plural=(n,w)=>n+' '+w+(n>1?'s':'');
const mb=b=>b<1e6?Math.max(1,Math.round(b/1e3))+' Ko':(b/1e6).toFixed(b<1e8?1:0).replace('.',',')+' Mo';
function ago(ts){const d=Math.floor((Date.now()-ts)/864e5);return d<=0?'aujourd’hui':d===1?'hier':'il y a '+d+' jours'}
function frDate(ts){try{return new Date(ts).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}catch(_){return ''}}

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>{t.hidden=true},2600)}
function errMsg(e){
  if(e&&(e.name==='QuotaExceededError'||e.code===22))return 'Il n’y a plus assez de place sur ton téléphone. Libère de l’espace puis réessaie.';
  if(e&&e.message==='format')return 'Ce format de photo n’est pas pris en charge. Essaie une photo JPEG ou PNG.';
  return 'L’enregistrement a échoué. Réessaie.';
}

/* ---------- Storage on the phone (IndexedDB) ---------- */
let idb=null;
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open('saphir-inclusions',1);
  r.onupgradeneeded=()=>{const d=r.result;['themes','photos','images'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})});if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'k'})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));
})}
function tx(stores,fn){return new Promise((res,rej)=>{const t=idb.transaction(stores,'readwrite');try{fn(t)}catch(e){rej(e);return}t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('abort'))})}
function getAll(s){return new Promise((res,rej)=>{const r=idb.transaction(s).objectStore(s).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function getOne(s,k){return new Promise((res,rej)=>{const r=idb.transaction(s).objectStore(s).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function setURLs(id,fullBlob,thumbBlob){dropURLs(id);URLS[id]={full:URL.createObjectURL(fullBlob),thumb:URL.createObjectURL(thumbBlob||fullBlob)}}
function dropURLs(id){const u=URLS[id];if(!u)return;URL.revokeObjectURL(u.full);if(u.thumb!==u.full)URL.revokeObjectURL(u.thumb);delete URLS[id]}
const STARTER=[['Soie de rutile intacte','u'],['Cristal englobé intact','u'],['Soie partiellement dissoute','h'],['Cristal avec disque de tension','h'],['Stries courbes et bulles','s']];
async function loadAll(){
  let themes=await getAll('themes');
  if(!themes.length&&!(await getOne('meta','seeded'))){
    const now=Date.now();themes=STARTER.map(([name,section],i)=>({id:uid()+i,name,section,createdAt:now+i}));
    await tx(['themes','meta'],t=>{themes.forEach(x=>t.objectStore('themes').put(x));t.objectStore('meta').put({k:'seeded',v:now})});
  }
  const photos=await getAll('photos'),images=await getAll('images'),lb=await getOne('meta','lastBackup');
  Object.keys(URLS).forEach(dropURLs);
  images.forEach(im=>{if(im&&im.full)setURLs(im.id,im.full,im.thumb)});
  st.themes=themes;st.photos=photos;st.lastBackup=lb?lb.v:null;st.ready=true;
}
function keepStorage(){try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(_){}}

/* ---------- Photos: decode, shrink, make a thumbnail ---------- */
function toJpeg(img,W,H,max,q){
  const sc=Math.min(1,max/Math.max(W,H)),c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(W*sc));c.height=Math.max(1,Math.round(H*sc));
  const g=c.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('format')),'image/jpeg',q));
}
async function prepare(file){
  let img,u=null;
  try{img=await createImageBitmap(file)}
  catch(_){u=URL.createObjectURL(file);img=new Image();img.src=u;try{await img.decode()}catch(e){URL.revokeObjectURL(u);throw new Error('format')}}
  try{
    const W=img.naturalWidth||img.width,H=img.naturalHeight||img.height;
    if(!W||!H)throw new Error('format');
    const f=await toJpeg(img,W,H,2560,0.9),t=await toJpeg(img,W,H,560,0.82);
    return {full:f,thumb:t};
  }finally{if(img.close)img.close();if(u)URL.revokeObjectURL(u)}
}

/* ---------- Backup: a .zip with data.json, images/ and thumbs/ ---------- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
async function zipStore(entries,progress){
  const enc=new TextEncoder(),parts=[],central=[];let offset=0;
  for(let i=0;i<entries.length;i++){
    const e=entries[i],name=enc.encode(e.name),data=new Uint8Array(await e.blob.arrayBuffer()),crc=crc32(data),size=data.length;
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,0,true);lh.setUint16(12,0x21,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,size,true);lh.setUint32(22,size,true);lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
    parts.push(lh.buffer,name,e.blob);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,0,true);ch.setUint16(14,0x21,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,size,true);ch.setUint32(24,size,true);ch.setUint16(28,name.length,true);
    ch.setUint16(30,0,true);ch.setUint16(32,0,true);ch.setUint16(34,0,true);ch.setUint16(36,0,true);ch.setUint32(38,0,true);ch.setUint32(42,offset,true);
    central.push(ch.buffer,name);offset+=30+name.length+size;
    if(progress)progress(i+1,entries.length);
  }
  let cd=0;central.forEach(c=>{cd+=c.byteLength});
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,entries.length,true);end.setUint16(10,entries.length,true);end.setUint32(12,cd,true);end.setUint32(16,offset,true);
  return new Blob(parts.concat(central,[end.buffer]),{type:'application/zip'});
}
async function readZip(file){
  const len=file.size,tl=Math.min(len,65557);if(len<22)throw new Error('zip');
  const tail=new DataView(await file.slice(len-tl).arrayBuffer());let eo=-1;
  for(let i=tl-22;i>=0;i--){if(tail.getUint32(i,true)===0x06054b50){eo=i;break}}
  if(eo<0)throw new Error('zip');
  const count=tail.getUint16(eo+10,true),cdSize=tail.getUint32(eo+12,true),cdOff=tail.getUint32(eo+16,true);
  const buf=await file.slice(cdOff,cdOff+cdSize).arrayBuffer(),cd=new DataView(buf),dec=new TextDecoder(),files={};let p=0;
  for(let i=0;i<count;i++){
    if(cd.getUint32(p,true)!==0x02014b50)throw new Error('zip');
    const method=cd.getUint16(p+10,true),csize=cd.getUint32(p+20,true),nl=cd.getUint16(p+28,true),xl=cd.getUint16(p+30,true),cl=cd.getUint16(p+32,true),lo=cd.getUint32(p+42,true);
    files[dec.decode(new Uint8Array(buf,p+46,nl))]={method,csize,lo};p+=46+nl+xl+cl;
  }
  async function get(name,type){
    const f=files[name];if(!f)return null;
    const lh=new DataView(await file.slice(f.lo,f.lo+30).arrayBuffer()),start=f.lo+30+lh.getUint16(26,true)+lh.getUint16(28,true);
    const raw=file.slice(start,start+f.csize);
    let out;
    if(f.method===0)out=raw;
    else if(f.method===8&&typeof DecompressionStream!=='undefined')out=await new Response(raw.stream().pipeThrough(new DecompressionStream('deflate-raw'))).blob();
    else throw new Error('zip');
    return new Blob([await out.arrayBuffer()],{type:type||''});
  }
  return {files,get};
}
async function makeBackup(progress){
  const entries=[{name:'data.json',blob:new Blob([JSON.stringify({app:'saphir-inclusions',version:1,exportedAt:Date.now(),themes:st.themes,photos:st.photos})],{type:'application/json'})}];
  for(const p of st.photos){const im=await getOne('images',p.imgId);if(im&&im.full){entries.push({name:'images/'+p.imgId+'.jpg',blob:im.full});if(im.thumb)entries.push({name:'thumbs/'+p.imgId+'.jpg',blob:im.thumb})}}
  return zipStore(entries,progress);
}
function downloadFile(f){const u=URL.createObjectURL(f),a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
async function markBackup(){const now=Date.now();st.lastBackup=now;try{await tx(['meta'],t=>t.objectStore('meta').put({k:'lastBackup',v:now}))}catch(_){}}

/* ---------- Views ---------- */
function segSec(action,cur,withMix){
  const keys=withMix?SECS.concat('m'):SECS;
  return '<div class="seg'+(withMix?' four':'')+'" role="tablist" aria-label="Sections">'+keys.map(k=>{
    const n=k==='m'?st.photos.filter(p=>secOf(p)).length:countSec(k);
    return '<button type="button" role="tab" class="sg-'+k+'" aria-selected="'+(cur===k)+'" data-a="'+action+'" data-v="'+k+'"><span class="lab">'+(k==='m'?'Mélangé':'<span class="dot"></span>'+SEC[k])+'</span><span class="n">'+(st.ready?n:'·')+'</span></button>';
  }).join('')+'</div>';
}
function failed(){return '<div class="panel"><p><strong>Le stockage du téléphone n’est pas accessible.</strong></p><p class="sub">Vérifie que tu n’es pas en navigation privée, puis rouvre l’appli.</p></div>'}
function needsBackup(){return st.photos.length>0&&(!st.lastBackup||Date.now()-st.lastBackup>14*864e5)}

  let h='<header class="top"><div class="toprow"><div><div class="eyebrow">Corindon · Al₂O₃</div><h1>Saphir</h1></div><button type="button" class="btn ghost iconbtn" data-a="openBackup" aria-label="Sauvegarde">'+ic('save')+'</button></div></header>';
  if(st.ready&&needsBackup())h+='<button type="button" class="banner" data-a="openBackup">'+ic('save')+'<span>Pense à sauvegarder tes photos. Dernière sauvegarde : '+(st.lastBackup?ago(st.lastBackup):'jamais')+'.</span></button>';
  h+=segSec('sec',st.sec,false);
  if(st.failed)return h+failed();
  if(!st.ready)return h+'<p class="hint">Chargement de tes photos…</p>';
  const list=rootsIn(st.sec);
  h+='<div class="list">';
  if(!list.length)h+='<div class="empty"><p>Aucun thème dans '+SEC[st.sec]+' pour l’instant.</p><p class="sub">Un thème regroupe toutes tes photos d’une même inclusion, par exemple « Soie de rutile intacte ».</p></div>';
  list.forEach(t=>{h+=folderRow(t)});

  h+=st.newTheme
    ?'<div class="panel"><div><label class="f" for="tn">Nouveau thème dans '+SEC[st.sec]+'</label><input type="text" id="tn" autocomplete="off" placeholder="Aiguilles de boehmite"></div><div class="err" id="tnErr"></div><div class="actions"><button type="button" class="btn primary" data-a="createTheme">'+ic('check')+'Créer le thème</button><button type="button" class="btn ghost" data-a="cancelNewTheme">Annuler</button></div></div>'

function folderRow(t){const ps=photosDeep(t.id),nk=subtree(t.id).length-1;
  return '<button type="button" class="row" data-a="openTheme" data-v="'+esc(t.id)+'"><span class="thumb">'+(ps[0]&&thumb(ps[0])?'<img src="'+thumb(ps[0])+'" alt="">':ic(t.parentId?'folder':'gem'))+'</span><span class="t"><span class="name">'+esc(t.name)+'</span><span class="cnt">'+(nk?plural(nk,'dossier')+' · ':'')+plural(ps.length,'photo')+'</span></span>'+ic('chev')+'</button>';}
function folderOptions(sel){return SECS.map(k=>{const out=[];
  const walk=(t,d)=>{out.push('<option value="'+esc(t.id)+'"'+(t.id===sel?' selected':'')+'>'+'   '.repeat(d)+(d?'↳ ':'')+esc(t.name)+'</option>');if(d<20)kids(t.id).forEach(x=>walk(x,d+1))};
  rootsIn(k).forEach(t=>walk(t,0));return out.length?'<optgroup label="'+SEC[k]+'">'+out.join('')+'</optgroup>':'';}).join('')}
function pathParts(id){const c=chain(id);return {root:c[0]?c[0].name:'',sub:c.slice(1).map(x=>x.name).join(' › ')}}
function pathHtml(id,tag,cls){const x=pathParts(id);return '<'+tag+(tag==='div'?' class="vt"':'')+'>'+esc(x.root)+'</'+tag+'>'+(x.sub?'<span class="'+cls+'">› '+esc(x.sub)+'</span>':'')}

function curDeck(){return st.deck.map(id=>st.photos.find(p=>p.id===id)).filter(p=>p&&secOf(p))}
function vRev(){
  let h='<header class="top"><div class="eyebrow">Réviser</div><h1>Flashcards</h1></header>'+segSec('rsec',st.rsec,true);
  if(st.failed)return h+failed();
  if(!st.ready)return h+'<p class="hint">Chargement…</p>';
  const deck=curDeck();
  if(!deck.length)return h+'<div class="empty"><p>Pas encore de photo '+(st.rsec==='m'?'à réviser':'dans '+SEC[st.rsec])+'.</p><p class="sub">Ajoute des photos dans « Mes photos » : chacune devient une carte ici.</p></div>';
  if(st.ri>=deck.length)st.ri=0;
  const p=deck[st.ri],t=theme(p.themeId),k=t.section;
  h+='<div class="card" data-a="flip" role="button" tabindex="0" aria-label="'+(st.flip?'Revoir la photo':'Retourner la carte')+'">';
  h+=!st.flip
    ?'<div class="face"><div class="cimg"><img src="'+full(p)+'" alt="Photo à identifier"><button type="button" class="zoombtn" data-a="revZoom" aria-label="Agrandir la photo">'+ic('zoom')+'</button></div><span class="chint">'+(st.rsec==='m'?'Unheated, heated ou synthétique ? Touche pour vérifier.':'Quelle inclusion ? Touche pour voir ta description.')+'</span></div>'
    :'<div class="face verso"><span class="chip '+k+'"><span class="dot"></span>'+SEC[k]+'</span>'+pathHtml(p.themeId,'h2','crumbs')+'<p class="cdesc">'+(p.desc?esc(p.desc):'<span class="none">Pas encore de description.</span>')+'</p><span class="chint">Touche pour revoir la photo</span></div>';
  h+='</div><div class="rnav"><button type="button" class="btn" data-a="rPrev" aria-label="Carte précédente">'+ic('back')+'</button><span class="rc">'+(st.ri+1)+' / '+deck.length+'</span><button type="button" class="btn" data-a="rNext" aria-label="Carte suivante">'+ic('chev')+'</button></div>';
  h+='<button type="button" class="btn ghost block" data-a="reshuffle">'+ic('shuffle')+'Mélanger à nouveau</button>';
  return h;
}

function vBackup(){
  const b=st.bk;
  let h='<div class="bar"><button type="button" class="btn ghost" data-a="closeBackup">'+ic('back')+'Retour</button></div>';
  h+='<div class="thead"><h2>Sauvegarde</h2></div><p class="lead">Tes photos sont enregistrées uniquement dans ce téléphone. Si tu supprimes l’appli ou changes de téléphone, elles disparaissent. Fais une sauvegarde de temps en temps et range-la dans Fichiers, iCloud Drive ou Google Drive.</p>';
  h+='<div class="panel"><div class="stats"><div><span class="k">Thèmes</span><span class="v">'+st.themes.length+'</span></div><div><span class="k">Photos</span><span class="v">'+st.photos.length+'</span></div><div><span class="k">Espace</span><span class="v" id="bkUsage">'+(b.usage!=null?mb(b.usage):'–')+'</span></div></div>';
  h+='<p class="sub">Dernière sauvegarde : '+(st.lastBackup?frDate(st.lastBackup)+' ('+ago(st.lastBackup)+')':'jamais')+'</p></div>';
  h+='<div class="panel"><h3>Créer une sauvegarde</h3>';
  if(b.phase==='ready')h+='<p>Ta sauvegarde est prête ('+mb(b.size)+'). Touche le bouton, puis choisis « Enregistrer dans Fichiers » ou l’endroit où tu veux la garder.</p><button type="button" class="btn primary block" data-a="shareBackup">'+ic('share')+'Enregistrer la sauvegarde</button>';
  else if(b.phase==='building')h+='<button type="button" class="btn primary block" id="bkBtn" aria-disabled="true">Préparation… '+esc(b.progress)+'</button>';
  else h+='<p class="sub">Un seul fichier .zip avec tous tes thèmes, photos et descriptions.</p><button type="button" class="btn primary block" data-a="buildBackup"'+(b.phase==='restoring'?' aria-disabled="true"':'')+'>'+ic('save')+'Créer une sauvegarde</button>';
  h+='</div><div class="panel"><h3>Restaurer une sauvegarde</h3>';
  if(b.phase==='restorePreview'){const d=b.restore.data;
    h+='<p>Cette sauvegarde'+(d.exportedAt?' du '+frDate(d.exportedAt):'')+' contient '+plural(d.themes.length,'thème')+' et '+plural(d.photos.length,'photo')+'. Elle s’ajoute à ce que tu as déjà : rien n’est effacé.</p><div class="actions"><button type="button" class="btn primary" data-a="doRestore">'+ic('check')+'Restaurer</button><button type="button" class="btn ghost" data-a="cancelRestore">Annuler</button></div>';
  }else if(b.phase==='restoring')h+='<button type="button" class="btn block" id="rsBtn" aria-disabled="true">Restauration… '+esc(b.progress)+'</button>';
  else h+='<p class="sub">Pour retrouver tes photos sur un nouveau téléphone, ou après avoir réinstallé l’appli.</p><label class="btn block rel">'+ic('upload')+'Choisir un fichier de sauvegarde<input type="file" id="restoreFile" accept=".zip,application/zip" class="sr"></label>';
  h+='<div class="err" id="bkErr">'+esc(b.msg)+'</div></div>';
  return h;
}

function render(){
  const v=st.view;
  document.getElementById('app').innerHTML=v==='form'?vForm():v==='theme'?vTheme():v==='rev'?vRev():v==='backup'?vBackup():vLib();
  document.getElementById('nav').hidden=v==='form';
  document.body.classList.toggle('noNav',v==='form');
  document.body.classList.toggle('hasSheet',v==='theme'&&!!st.sel&&!st.move);
  document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',(b.dataset.v==='rev')===(v==='rev')&&v!=='backup'?'page':'false'));
}
function go(view){st.view=view;window.scrollTo(0,0);render()}
function buildDeck(){
  const ids=st.photos.filter(p=>{const k=secOf(p);return k&&(st.rsec==='m'||k===st.rsec)}).map(p=>p.id);
  for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
  st.deck=ids;st.ri=0;st.flip=false;
}

/* ---------- Viewer with pinch, pan, double-tap and swipe ---------- */
function openViewer(ids,i,blind){st.viewer={ids,i,blind:!!blind};document.documentElement.style.overflow='hidden';renderViewer(true)}
function closeViewer(){st.viewer=null;document.documentElement.style.overflow='';renderViewer()}
function stepViewer(d){const V=st.viewer;if(!V||V.blind||V.ids.length<2)return;V.i=(V.i+d+V.ids.length)%V.ids.length;renderViewer()}
function renderViewer(focus){
  const el=document.getElementById('viewer');
  if(!st.viewer){el.className='';el.innerHTML='';el.removeAttribute('role');return}
  const V=st.viewer;V.ids=V.ids.filter(id=>st.photos.some(p=>p.id===id));
  if(!V.ids.length){closeViewer();return}
  if(V.i>=V.ids.length)V.i=V.ids.length-1;
  const p=st.photos.find(x=>x.id===V.ids[V.i]),t=theme(p.themeId),k=t?t.section:'u';
  el.className='viewer';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label','Photo en grand');
  let h='<div class="vbar"><button type="button" class="vbtn" data-a="closeV" aria-label="Fermer">'+ic('x')+'</button><span class="vcount">'+(V.blind?'':(V.i+1)+' / '+V.ids.length)+'</span>'
    +(!V.blind?'<button type="button" class="vbtn" data-a="editFromV">'+ic('pencil')+'Modifier</button>':'<span class="vsp"></span>')+'</div>';
  h+='<div class="stage" id="stage"><img id="vimg" src="'+full(p)+'" alt="'+esc(V.blind?'Photo à identifier':(p.desc||'Photo d’inclusion').slice(0,120))+'" draggable="false"></div>';
  h+='<div class="vinfo">'+(V.blind
    ?'<p class="vhint">Touche deux fois pour zoomer, ou pince avec deux doigts. Ferme pour répondre.</p>'
    :'<span class="chip '+k+'"><span class="dot"></span>'+SEC[k]+'</span>'+pathHtml(p.themeId,'div','vcr')+'<p class="vd">'+(p.desc?esc(p.desc):'<span class="none">Pas encore de description.</span>')+'</p><div class="vnav">'
      +(V.ids.length>1?'<button type="button" class="vbtn" data-a="vPrev" aria-label="Photo précédente">'+ic('back')+'</button><button type="button" class="vbtn" data-a="vNext" aria-label="Photo suivante">'+ic('chev')+'</button>':'')
      +'<p class="vhint">Touche deux fois pour zoomer</p></div>')+'</div>';
  el.innerHTML=h;
  attachZoom(document.getElementById('stage'),document.getElementById('vimg'),stepViewer);
  if(focus){const c=el.querySelector('[data-a="closeV"]');if(c)c.focus({preventScroll:true})}
}
function attachZoom(stage,img,onSwipe){
  let s=1,tx=0,ty=0,start=null,pinched=false,moved=false,downX=0,downY=0,lastTap=0,lastX=0,lastY=0;
  const pts=new Map();
  const apply=anim=>{img.style.transition=anim?'transform .22s ease':'none';img.style.transform='translate('+tx+'px,'+ty+'px) scale('+s+')'};
  const clamp=()=>{const w=img.offsetWidth,h=img.offsetHeight,mx=Math.max(0,(w*s-w)/2),my=Math.max(0,(h*s-h)/2);tx=Math.min(mx,Math.max(-mx,tx));ty=Math.min(my,Math.max(-my,ty))};
  const center=()=>{const r=stage.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}};
  const zoomAt=(ns,px,py)=>{const c=center(),qx=px-c.x,qy=py-c.y;tx=qx-ns*(qx-tx)/s;ty=qy-ns*(qy-ty)/s;s=ns;if(s<=1.02){s=1;tx=0;ty=0}clamp()};
  stage.addEventListener('gesturestart',e=>e.preventDefault());
  stage.addEventListener('pointerdown',e=>{
    try{stage.setPointerCapture(e.pointerId)}catch(_){}
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){pinched=false;moved=false;downX=e.clientX;downY=e.clientY;start={x:e.clientX,y:e.clientY,tx,ty}}
    else if(pts.size===2){const [a,b]=[...pts.values()];pinched=true;start={d:Math.hypot(a.x-b.x,a.y-b.y)||1,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,s,tx,ty}}
  });
  stage.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId)||!start)return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2&&start.d){
      const [a,b]=[...pts.values()],d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2,c=center();
      const ns=Math.min(6,Math.max(1,start.s*d/start.d)),ux=(start.mx-c.x-start.tx)/start.s,uy=(start.my-c.y-start.ty)/start.s;
      s=ns;tx=(mx-c.x)-ns*ux;ty=(my-c.y)-ns*uy;if(s<=1.02){s=1;tx=0;ty=0}clamp();moved=true;apply(false);
    }else if(pts.size===1&&start.d===undefined){
      const dx=e.clientX-start.x,dy=e.clientY-start.y;
      if(Math.abs(dx)>6||Math.abs(dy)>6)moved=true;
      if(s>1){tx=start.tx+dx;ty=start.ty+dy;clamp();apply(false)}
    }
  });
  const up=e=>{
    if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
    if(pts.size===1){const [a]=[...pts.values()];start={x:a.x,y:a.y,tx,ty};return}
    if(pts.size>0)return;
    const dx=e.clientX-downX,dy=e.clientY-downY;
    if(!moved){
      const now=Date.now();
      if(now-lastTap<320&&Math.hypot(e.clientX-lastX,e.clientY-lastY)<40){if(s>1){s=1;tx=0;ty=0}else zoomAt(2.5,e.clientX,e.clientY);apply(true);lastTap=0}
      else{lastTap=now;lastX=e.clientX;lastY=e.clientY}
    }else if(!pinched&&s===1&&Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.4){onSwipe(dx<0?1:-1)}
    start=null;
  };
  stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
  stage.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.min(6,Math.max(1,s*(e.deltaY<0?1.15:1/1.15))),e.clientX,e.clientY);apply(false)},{passive:false});
  apply(false);
}

/* ---------- Writes ---------- */
async function createTheme(){
  if(st.busy)return;const el=document.getElementById('tn');if(!el)return;const name=el.value.trim();
  if(!name){document.getElementById('tnErr').textContent='Donne un nom au thème.';el.focus();return}
  st.busy=true;
  try{const t={id:uid(),name,section:st.sec,createdAt:Date.now()};await tx(['themes'],x=>x.objectStore('themes').put(t));st.themes.push(t);st.newTheme=false;st.themeId=t.id;go('theme');toast('Thème créé')}
  catch(e){const x=document.getElementById('tnErr');if(x)x.textContent=errMsg(e)}
  st.busy=false;
}
async function renameTheme(){
  if(st.busy)return;const el=document.getElementById('rn');if(!el)return;const name=el.value.trim();
  if(!name){document.getElementById('rnErr').textContent='Le nom ne peut pas être vide.';el.focus();return}
  st.busy=true;
  try{const t=theme(st.themeId),n=Object.assign({},t,{name});await tx(['themes'],x=>x.objectStore('themes').put(n));Object.assign(t,{name});st.themeMenu=false;st.confirmDelTheme=false;render();toast('Nom enregistré')}
  catch(e){const x=document.getElementById('rnErr');if(x)x.textContent=errMsg(e)}
  st.busy=false;
}
async function delTheme(){
  if(st.busy)return;st.busy=true;const id=st.themeId,t=theme(id),ids=new Set(subtree(id)),ps=st.photos.filter(p=>ids.has(p.themeId));
  try{
    await tx(['themes','photos','images'],x=>{ps.forEach(p=>{x.objectStore('photos').delete(p.id);x.objectStore('images').delete(p.imgId)});ids.forEach(k=>x.objectStore('themes').delete(k))});
    ps.forEach(p=>dropURLs(p.imgId));st.photos=st.photos.filter(p=>!ids.has(p.themeId));st.themes=st.themes.filter(x=>!ids.has(x.id));
    const parent=t&&t.parentId?theme(t.parentId):null;resetFolderUI();
    if(parent){st.themeId=parent.id;go('theme')}else{st.themeId=null;go('lib')}
    toast(t&&t.parentId?'Dossier supprimé':'Thème supprimé');
  }catch(e){toast(errMsg(e))}
  st.busy=false;
}
function resetFolderUI(){st.themeMenu=false;st.confirmDelTheme=false;st.newFolder=false;st.sel=null;st.move=null}
async function createFolder(){
  if(st.busy)return;const el=document.getElementById('fn');if(!el)return;const name=el.value.trim();
  if(!name){document.getElementById('fnErr').textContent='Donne un nom au dossier.';el.focus();return}
  const cur=theme(st.themeId);if(!cur)return;st.busy=true;
  try{const f={id:uid(),name,section:cur.section,parentId:cur.id,createdAt:Date.now()};await tx(['themes'],x=>x.objectStore('themes').put(f));st.themes.push(f);st.newFolder=false;render();toast('Dossier créé')}
  catch(e){const x=document.getElementById('fnErr');if(x)x.textContent=errMsg(e)}
  st.busy=false;
}
async function doMove(){
  if(st.busy||!st.sel||!st.move)return;const err=document.getElementById('mvErr'),ids=[...st.sel],cur=theme(st.themeId);let dest=st.move.dest;
  if(!ids.length){err.textContent='Sélectionne au moins une photo.';return}
  if(dest==='__new'&&!(st.move.name||'').trim()){err.textContent='Donne un nom au nouveau dossier.';const el=document.getElementById('mvName');if(el)el.focus();return}
  if(!cur)return;st.busy=true;
  try{
    if(dest==='__new'){const f={id:uid(),name:st.move.name.trim(),section:cur.section,parentId:cur.id,createdAt:Date.now()};await tx(['themes'],x=>x.objectStore('themes').put(f));st.themes.push(f);dest=f.id}
    const d=theme(dest),moved=ids.map(id=>st.photos.find(p=>p.id===id)).filter(Boolean);
    await tx(['photos'],x=>moved.forEach(p=>x.objectStore('photos').put(Object.assign({},p,{themeId:dest}))));
    moved.forEach(p=>{p.themeId=dest});
    st.sel=null;st.move=null;render();toast(plural(moved.length,'photo')+' rangée'+(moved.length>1?'s':'')+' dans « '+(d?d.name:'')+' »');
  }catch(e){err.textContent=errMsg(e)}
  st.busy=false;
}
async function savePhoto(){
  if(st.saving||!st.form)return;const f=st.form,errEl=document.getElementById('fErr');
  if(f.preparing){errEl.textContent='La photo est encore en préparation, un instant.';return}
  if(f.mode==='add'&&!f.full){errEl.textContent='Choisis une photo d’abord.';return}
  if(!f.themeId||!theme(f.themeId)){errEl.textContent='Choisis un thème.';return}
  st.saving=true;f.err='';render();
  try{
    const desc=(f.desc||'').trim();
    if(f.mode==='add'){
      const imgId=uid(),p={id:uid(),themeId:f.themeId,desc,createdAt:Date.now(),imgId};
      await tx(['images','photos'],x=>{x.objectStore('images').put({id:imgId,full:f.full,thumb:f.thumb});x.objectStore('photos').put(p)});
      setURLs(imgId,f.full,f.thumb);st.photos.push(p);
    }else{
      const p=st.photos.find(x=>x.id===f.photoId);if(!p)throw new Error('gone');
      const n=Object.assign({},p,{themeId:f.themeId,desc});let old=null;
      if(f.full){old=p.imgId;n.imgId=uid()}
      await tx(['images','photos'],x=>{if(f.full){x.objectStore('images').put({id:n.imgId,full:f.full,thumb:f.thumb});x.objectStore('images').delete(old)}x.objectStore('photos').put(n)});
      if(f.full){setURLs(n.imgId,f.full,f.thumb);dropURLs(old)}
      Object.assign(p,n);
    }
    keepStorage();
    st.themeId=f.themeId;const msg=f.mode==='add'?'Photo ajoutée':'Modifications enregistrées';closeForm();toast(msg);
  }catch(e){st.saving=false;f.err=errMsg(e);render()}
}
async function delPhoto(){
  if(st.busy||!st.form)return;st.busy=true;const f=st.form,p=st.photos.find(x=>x.id===f.photoId);
  try{
    if(p){await tx(['images','photos'],x=>{x.objectStore('photos').delete(p.id);x.objectStore('images').delete(p.imgId)});dropURLs(p.imgId);st.photos=st.photos.filter(x=>x.id!==p.id)}
    closeForm();toast('Photo supprimée');
  }catch(e){f.err=errMsg(e);f.confirmDel=false;render()}
  st.busy=false;
}
function closeForm(){
  const f=st.form;if(f&&f.preview)URL.revokeObjectURL(f.preview);
  const ret=f&&f.ret;st.form=null;st.saving=false;
  go(ret==='rev'?'rev':(st.themeId&&theme(st.themeId)?'theme':'lib'));
}
function openEdit(p,ret){
  st.themeId=p.themeId;
  st.form={mode:'edit',photoId:p.id,themeId:p.themeId,imgId:p.imgId,desc:p.desc||'',full:null,thumb:null,preview:null,preparing:false,err:'',confirmDel:false,ret};
  go('form');
}
async function buildBackup(){
  const b=st.bk;if(b.phase==='building'||b.phase==='restoring')return;
  b.phase='building';b.progress='';b.msg='';render();
  try{
    const blob=await makeBackup((i,n)=>{b.progress=i+' / '+n;const el=document.getElementById('bkBtn');if(el)el.textContent='Préparation… '+b.progress});
    const d=new Date(),pad=n=>String(n).padStart(2,'0');
    b.file=new File([blob],'saphir-sauvegarde-'+d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'.zip',{type:'application/zip'});
    b.size=blob.size;b.phase='ready';
  }catch(e){b.phase='idle';b.msg='La sauvegarde n’a pas pu être créée. Réessaie.'}
  if(st.view==='backup')render();
}
async function doRestore(){
  const b=st.bk;if(!b.restore||b.phase==='restoring')return;
  const {z,data}=b.restore;b.phase='restoring';b.progress='';b.msg='';render();
  let added=0;
  try{
    const all=data.themes.filter(t=>t&&SAFE_ID.test(t.id)&&typeof t.name==='string'&&SECS.includes(t.section)),byId=new Map(all.map(t=>[t.id,t]));
    const depth=t=>{let d=0,x=t;while(x&&x.parentId&&byId.has(x.parentId)&&d<50){d++;x=byId.get(x.parentId)}return d};
    all.sort((a,b)=>depth(a)-depth(b));
    const key=(sec,par,name)=>sec+'|'+(par||'')+'|'+name.trim().toLowerCase(),existing=new Map(st.themes.map(t=>[key(t.section,t.parentId,t.name),t.id])),remap={},toPut=[];
    all.forEach(t=>{let par=t.parentId&&SAFE_ID.test(t.parentId)?(remap[t.parentId]||t.parentId):null;if(par&&!byId.has(t.parentId)&&!theme(par))par=null;
      const k=key(t.section,par,t.name),ex=existing.get(k);
      if(ex&&ex!==t.id)remap[t.id]=ex;else{toPut.push({id:t.id,name:t.name.slice(0,200),section:t.section,parentId:par,createdAt:+t.createdAt||Date.now()});existing.set(k,t.id)}});
    await tx(['themes'],x=>toPut.forEach(t=>x.objectStore('themes').put(t)));
    const photos=data.photos.filter(p=>p&&SAFE_ID.test(p.id)&&SAFE_ID.test(p.imgId)&&SAFE_ID.test(p.themeId));
    for(let i=0;i<photos.length;i++){
      const p=photos[i],f=await z.get('images/'+p.imgId+'.jpg','image/jpeg');
      if(f){const t=(await z.get('thumbs/'+p.imgId+'.jpg','image/jpeg'))||f;
        await tx(['images','photos'],x=>{x.objectStore('images').put({id:p.imgId,full:f,thumb:t});x.objectStore('photos').put({id:p.id,themeId:remap[p.themeId]||p.themeId,desc:typeof p.desc==='string'?p.desc:'',createdAt:+p.createdAt||Date.now(),imgId:p.imgId})});added++}
      b.progress=(i+1)+' / '+photos.length;const el=document.getElementById('rsBtn');if(el)el.textContent='Restauration… '+b.progress;
    }
    await loadAll();keepStorage();b.phase='idle';b.restore=null;render();toast('Sauvegarde restaurée : '+plural(added,'photo'));
  }catch(e){b.phase='idle';b.restore=null;b.msg=errMsg(e);await loadAll().catch(()=>{});render()}
}

/* ---------- Actions ---------- */
const ACT={
  tab:v=>{if(st.viewer)closeViewer();resetFolderUI();if(v==='rev'){buildDeck();go('rev')}else go(st.themeId&&theme(st.themeId)?'theme':'lib')},
  sec:v=>{st.sec=v;st.newTheme=false;render()},
  openTheme:v=>{st.themeId=v;resetFolderUI();go('theme')},
  back:()=>{const t=theme(st.themeId);resetFolderUI();if(t&&t.parentId&&theme(t.parentId)){st.themeId=t.parentId;go('theme')}else{st.themeId=null;go('lib')}},
  newFolder:()=>{st.newFolder=true;render();const el=document.getElementById('fn');if(el)el.focus()},
  cancelNewFolder:()=>{st.newFolder=false;render()},
  createFolder,doMove,
  selStart:()=>{st.sel=new Set();st.move=null;st.newFolder=false;st.themeMenu=false;render()},
  selCancel:()=>{st.sel=null;st.move=null;render()},
  selToggle:v=>{if(!st.sel)return;if(st.sel.has(v))st.sel.delete(v);else st.sel.add(v);render()},
  moveOpen:()=>{if(!st.sel||!st.sel.size){toast('Touche d’abord les photos à ranger');return}st.move={dest:'__new',name:''};render();const p=document.getElementById('mvPanel');if(p)p.scrollIntoView({block:'center'})},
  moveClose:()=>{st.move=null;render()},
  newTheme:()=>{st.newTheme=true;render();const el=document.getElementById('tn');if(el)el.focus()},
  cancelNewTheme:()=>{st.newTheme=false;render()},
  createTheme,renameTheme,delTheme,
  themeMenu:()=>{st.themeMenu=!st.themeMenu;st.confirmDelTheme=false;render()},
  askDelTheme:()=>{st.confirmDelTheme=true;render()},
  cancelDelTheme:()=>{st.confirmDelTheme=false;render()},
  view:v=>{openViewer(photosOf(st.themeId).map(p=>p.id),+v,false)},
  closeV:closeViewer,
  vPrev:()=>stepViewer(-1),vNext:()=>stepViewer(1),
  editFromV:()=>{const V=st.viewer;if(!V)return;const p=st.photos.find(x=>x.id===V.ids[V.i]);const ret=st.view==='rev'?'rev':'theme';closeViewer();if(p)openEdit(p,ret)},
  cancelForm:closeForm,savePhoto,delPhoto,
  askDelPhoto:()=>{st.form.confirmDel=true;render()},
  cancelDelPhoto:()=>{st.form.confirmDel=false;render()},
  rsec:v=>{st.rsec=v;buildDeck();render()},
  flip:()=>{st.flip=!st.flip;render()},
  rPrev:()=>{const n=curDeck().length;if(!n)return;st.ri=(st.ri-1+n)%n;st.flip=false;render()},
  rNext:()=>{const n=curDeck().length;if(!n)return;st.ri=(st.ri+1)%n;st.flip=false;render()},
  reshuffle:()=>{buildDeck();render();toast('Cartes mélangées')},
  revZoom:()=>{const d=curDeck();if(d[st.ri])openViewer([d[st.ri].id],0,!st.flip)},
  openBackup:()=>{st.bk.msg='';go('backup');try{navigator.storage.estimate().then(e=>{st.bk.usage=e.usage;const el=document.getElementById('bkUsage');if(el)el.textContent=mb(e.usage)}).catch(()=>{})}catch(_){}},
  closeBackup:()=>go(st.themeId&&theme(st.themeId)?'theme':'lib'),
  buildBackup,doRestore,
  shareBackup:()=>{
    const b=st.bk,f=b.file;if(!f)return;
    const done=()=>{markBackup().then(()=>{b.phase='idle';b.file=null;if(st.view==='backup')render()});toast('Sauvegarde enregistrée')};
    let canShare=false;try{canShare=!!(navigator.canShare&&navigator.canShare({files:[f]}))}catch(_){}
    if(canShare)navigator.share({files:[f],title:'Sauvegarde Saphir'}).then(done).catch(e=>{if(e&&e.name==='AbortError')return;downloadFile(f);done()});
    else{downloadFile(f);done()}
  },
  cancelRestore:()=>{st.bk.phase='idle';st.bk.restore=null;render()},
  reload:()=>location.reload()
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.tagName==='LABEL'||el.getAttribute('aria-disabled')==='true')return;const f=ACT[el.dataset.a];if(f){e.preventDefault();f(el.dataset.v,el,e)}});
document.addEventListener('keydown',e=>{
  if(st.viewer){if(e.key==='Escape')closeViewer();else if(e.key==='ArrowRight')stepViewer(1);else if(e.key==='ArrowLeft')stepViewer(-1);return}
  const el=e.target;
  if((e.key==='Enter'||e.key===' ')&&el.matches&&el.matches('[role="button"][data-a]')&&el.tagName!=='BUTTON'){e.preventDefault();const f=ACT[el.dataset.a];if(f)f(el.dataset.v,el,e)}
  if(e.key==='Enter'&&el.id==='tn'){e.preventDefault();createTheme()}
  if(e.key==='Enter'&&el.id==='rn'){e.preventDefault();renameTheme()}
  if(e.key==='Enter'&&el.id==='fn'){e.preventDefault();createFolder()}
  if(e.key==='Enter'&&el.id==='mvName'){e.preventDefault();doMove()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='fDesc'&&st.form){st.form.desc=t.value;st.form.err=''}
  if(t.id==='mvName'&&st.move)st.move.name=t.value;
  const map={tn:'tnErr',rn:'rnErr',fDesc:'fErr',fn:'fnErr',mvName:'mvErr'},x=map[t.id]&&document.getElementById(map[t.id]);if(x)x.textContent='';
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='fTheme'&&st.form){st.form.themeId=t.value;return}
  if(t.id==='mvDest'&&st.move){st.move.dest=t.value;render();return}
  if(t.id==='restoreFile'){
    const file=t.files&&t.files[0];t.value='';if(!file)return;const b=st.bk;b.msg='';
    try{const z=await readZip(file),dj=await z.get('data.json','application/json');if(!dj)throw new Error('zip');
      const data=JSON.parse(await dj.text());if(!data||data.app!=='saphir-inclusions'||!Array.isArray(data.themes)||!Array.isArray(data.photos))throw new Error('zip');
      b.restore={z,data};b.phase='restorePreview';
    }catch(_){b.msg='Ce fichier n’est pas une sauvegarde de l’appli Saphir.'}
    render();return;
  }
  if(t.id!=='addFile'&&t.id!=='chgFile')return;
  const file=t.files&&t.files[0];t.value='';if(!file)return;
  if(t.id==='addFile'){st.form={mode:'add',themeId:st.themeId,desc:'',full:null,thumb:null,preview:null,preparing:true,err:'',confirmDel:false,ret:'theme'};go('form')}
  else{st.form.preparing=true;st.form.err='';render()}
  const f=st.form;
  try{const r=await prepare(file);if(f.preview)URL.revokeObjectURL(f.preview);f.full=r.full;f.thumb=r.thumb;f.preview=URL.createObjectURL(r.full)}
  catch(err){f.err=errMsg(err)}
  f.preparing=false;if(st.form===f)render();
});

/* ---------- Start ---------- */
render();
(async()=>{
  try{idb=await openDB();await loadAll()}
  catch(e){st.failed=true}
  render();
})();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  let had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had){had=true;return}document.getElementById('upd').hidden=false});
  window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})});
}
</script>
</body>
</html>
